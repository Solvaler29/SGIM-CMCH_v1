{% extends 'base.html' %}
{% block title %}Crear Usuario - SGIM-CMCH{% endblock %}
{% block content %}
<h2>Crear Nuevo Usuario</h2>
<form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit" class="btn btn-primary">Crear Usuario</button>
    <a href="{% url 'accounts:usuarios_list' %}" class="btn btn-outline-secondary">Cancelar</a>
</form>
{% endblock %}
