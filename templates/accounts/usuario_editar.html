{% extends 'base.html' %}
{% block title %}Editar Usuario - SGIM-CMCH{% endblock %}
{% block content %}
<h2>Editar Usuario: {{ usuario.username }}</h2>
<form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit" class="btn btn-primary">Guardar</button>
    <a href="{% url 'accounts:usuarios_list' %}" class="btn btn-outline-secondary">Cancelar</a>
</form>
{% endblock %}
